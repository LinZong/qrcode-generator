[package]
name = "qrcode-generator"
version = "1.0.1"
description = "An offline QR code generator"
authors = ["QR Code Generator contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qrcode_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde_json = "1"
